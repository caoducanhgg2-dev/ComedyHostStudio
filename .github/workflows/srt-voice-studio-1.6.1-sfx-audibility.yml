name: Test SRT Voice Studio 1.6.1 SFX Audibility
on:
  workflow_dispatch:
  push:
    branches: ['srt-voice-studio/1.6.1-sfx-audibility']
    paths:
      - 'SRTVoiceStudio/**'
      - '.github/workflows/srt-voice-studio-1.6.1-sfx-audibility.yml'
permissions:
  contents: read

jobs:
  qa:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout 1.6.1 source
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Install locked Windows wheels
        working-directory: SRTVoiceStudio
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps unidic-lite==1.0.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare offline assets
        working-directory: SRTVoiceStudio
        run: python build_tools/prepare_assets.py

      - name: Run full source tests
        working-directory: SRTVoiceStudio
        run: python -m pytest -q --junitxml=test-results-1.6.1.xml

      - name: Run unified one-many SRT regression tests separately
        working-directory: SRTVoiceStudio
        run: python -m pytest -q tests/test_multifile_161.py

      - name: Run 1.6.1 audibility regression tests separately
        working-directory: SRTVoiceStudio
        run: python -m pytest -q tests/test_sfx_161.py

      - name: Stress SFX safety and speaker-band audibility
        working-directory: SRTVoiceStudio
        shell: pwsh
        run: |
          @'
          import numpy as np
          from studio.sfx_161 import apply_patch, speaker_band_ratio
          sfx=apply_patch()
          passed=0
          for kind in sfx.KIND_LABELS:
              for n in range(100):
                  a=sfx.synthesize_sfx(kind,f'1.6.1-{kind}-{n}')
                  q=sfx.inspect_sfx(a)
                  assert q['passed'],(kind,n,q)
                  assert np.isfinite(a).all() and np.max(np.abs(a))<=.70001
                  if kind in ('impact','suspense'):
                      assert speaker_band_ratio(a)>=.08,(kind,n,speaker_band_ratio(a))
                  passed+=1
          print({'sfx_qa_iterations':passed,'speaker_band_guard':True,'all_passed':True})
          '@ | python -

      - name: Verify Medium SFX audibility under continuous voice
        working-directory: SRTVoiceStudio
        shell: pwsh
        run: |
          @'
          import numpy as np
          from studio.sfx_161 import apply_patch
          sfx=apply_patch()
          from studio.render import Settings
          from studio.timeline import Caption,RATE
          caps=[Caption(1,0,4000,'Finally completed successfully!')]
          t=np.arange(4000*48)/RATE
          master=(.10*np.sin(2*np.pi*180*t)).astype(np.float32)
          r=sfx.mix_auto_sfx(master,caps,Settings(language='English US',auto_sfx=True,sfx_density='Balanced',sfx_strength='Medium'))
          assert r['mixed']==1 and r['rejected']==0,r
          e=r['events'][0]
          assert e['relative_rms']>=.22,e
          assert np.max(np.abs(master))<=.88001
          print({'mixed':r['mixed'],'relative_rms':e['relative_rms'],'peak':float(np.max(np.abs(master)))})
          '@ | python -

      - name: Build frozen 1.6.1 app
        working-directory: SRTVoiceStudio
        run: python -m PyInstaller --clean --noconfirm SRTVoiceStudio.spec

      - name: Test frozen app
        working-directory: SRTVoiceStudio
        run: python build_tools/check_frozen.py

      - name: Run frozen 1.6.1 SFX self-test
        working-directory: SRTVoiceStudio
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\dist\SRTVoiceStudio\SRTVoiceStudio.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--sfx-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen SFX self-test exited with $($p.ExitCode)" }
          Write-Host 'Frozen SFX 1.6.1 self-test: PASS'

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: SRTVoiceStudio_1.6.1_QA
          path: |
            SRTVoiceStudio/test-results-1.6.1.xml
          retention-days: 30
