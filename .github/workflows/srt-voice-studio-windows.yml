name: Build SRT Voice Studio Windows
on:
  workflow_dispatch:
  push:
    branches: [main, 'srt-voice-studio/**']
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SRTVoiceStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install locked Windows wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps unidic-lite==1.0.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze > installed-dependencies.txt
      - name: Bundle offline models and FFmpeg
        run: python build_tools/prepare_assets.py
      - name: Unit and real PCM tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Verify actual bundled FFmpeg filters
        run: python build_tools/verify_filters.py
      - name: Build frozen app
        run: python -m PyInstaller --clean --noconfirm SRTVoiceStudio.spec
      - name: Test frozen app before installer
        run: python build_tools/check_frozen.py
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Download verified 1.1 installer for upgrade acceptance
        uses: actions/download-artifact@v4
        with:
          name: SRTVoiceStudio_Setup_1.1.0
          run-id: 34472581469
          github-token: ${{ github.token }}
          path: SRTVoiceStudio/baseline-installer
      - name: Test upgrade, clean install, offline A-B-C, real 74 captions, uninstall
        run: python build_tools/smoke_installer.py
      - name: Installer checksum
        run: |
          $digest = (Get-FileHash installer-output/SRTVoiceStudio_Setup_1.2.0.exe -Algorithm SHA256).Hash
          "$digest  SRTVoiceStudio_Setup_1.2.0.exe" | Set-Content installer-output/SHA256SUMS.txt
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: SRTVoiceStudio_Setup_1.2.0
          path: |
            SRTVoiceStudio/installer-output/SRTVoiceStudio_Setup_1.2.0.exe
            SRTVoiceStudio/installer-output/SHA256SUMS.txt
            SRTVoiceStudio/installer-output/acceptance.json
            SRTVoiceStudio/test-results.xml
            SRTVoiceStudio/filter-validation.json
          if-no-files-found: error
      - name: Collect app logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          Copy-Item "$env:LOCALAPPDATA/SRTVoiceStudio/logs/latest.log" ci-logs/latest.log -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/SRTVoiceStudio/self-test.json" ci-logs/self-test.json -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/SRTVoiceStudio/ui-test.json" ci-logs/ui-test.json -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/SRTVoiceStudio/ui-preview.png" ci-logs/ui-preview.png -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/SRTVoiceStudio/stress-test.json" ci-logs/stress-test.json -ErrorAction SilentlyContinue
          exit 0
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            SRTVoiceStudio/test-results.xml
            SRTVoiceStudio/installed-dependencies.txt
            SRTVoiceStudio/build-assets/sha256.json
            SRTVoiceStudio/build/SRTVoiceStudio/warn-SRTVoiceStudio.txt
            SRTVoiceStudio/ci-logs/
