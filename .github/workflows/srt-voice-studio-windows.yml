name: Build SRT Voice Studio Windows
on:
  workflow_dispatch:
  push:
    branches: [main, 'srt-voice-studio/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SRTVoiceStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install locked Windows wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps unidic-lite==1.0.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze > installed-dependencies.txt
      - name: Bundle offline models and FFmpeg
        run: python build_tools/prepare_assets.py
      - name: Unit and real PCM tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build frozen app
        run: python -m PyInstaller --clean --noconfirm SRTVoiceStudio.spec
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Test installer, offline English and Japanese, Unicode paths, uninstall
        run: python build_tools/smoke_installer.py
      - name: Installer checksum
        run: |
          $digest = (Get-FileHash installer-output/SRTVoiceStudio_Setup.exe -Algorithm SHA256).Hash
          "$digest  SRTVoiceStudio_Setup.exe" | Set-Content installer-output/SHA256SUMS.txt
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: SRTVoiceStudio_Setup
          path: |
            SRTVoiceStudio/installer-output/SRTVoiceStudio_Setup.exe
            SRTVoiceStudio/installer-output/SHA256SUMS.txt
            SRTVoiceStudio/installer-output/acceptance.json
          if-no-files-found: error
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            SRTVoiceStudio/test-results.xml
            SRTVoiceStudio/installed-dependencies.txt
            SRTVoiceStudio/build-assets/sha256.json
            SRTVoiceStudio/build/SRTVoiceStudio/warn-SRTVoiceStudio.txt
            ~/AppData/Local/SRTVoiceStudio/logs/latest.log
