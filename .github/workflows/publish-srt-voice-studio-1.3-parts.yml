name: Publish SRT Voice Studio 1.3 Download Parts

on:
  push:
    branches:
      - srt-voice-studio/1.3.0
    paths:
      - .github/workflows/publish-srt-voice-studio-1.3-parts.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download verified installer artifact from successful run
        uses: actions/download-artifact@v4
        with:
          name: SRTVoiceStudio_Setup_1.3.0
          path: verified
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: caoducanhgg2-dev/ComedyHostStudio
          run-id: 34854705948

      - name: Verify installer and create 25 MiB parts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'F955633C700A48B87E8C96B4B2AD8A40D0FC522A0720A37EFF3D51DAE2A9A6CC'
          $exe = Get-ChildItem -Path verified -Recurse -Filter 'SRTVoiceStudio_Setup_1.3.0.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Verified installer EXE not found in artifact.' }
          $actual = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToUpperInvariant()
          if ($actual -ne $expected) { throw "Installer SHA-256 mismatch. Expected $expected, got $actual" }

          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Copy-Item $exe.FullName 'release_assets/SRTVoiceStudio_Setup_1.3.0.exe'

          $chunkSize = 25MB
          $buffer = New-Object byte[] $chunkSize
          $input = [System.IO.File]::OpenRead($exe.FullName)
          try {
            $index = 0
            while (($read = $input.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $name = ('SRTVoiceStudio_1.3.0.part{0:D2}.bin' -f $index)
              $path = Join-Path 'release_assets' $name
              $output = [System.IO.File]::Create($path)
              try { $output.Write($buffer, 0, $read) } finally { $output.Dispose() }
              $index++
            }
          } finally { $input.Dispose() }

          $partCount = $index
          $bat = @"
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          echo ================================================
          echo   GHEP SRT VOICE STUDIO 1.3.0
          echo ================================================
          echo.
          if exist "SRTVoiceStudio_Setup_1.3.0.exe" del /q "SRTVoiceStudio_Setup_1.3.0.exe"
          copy /b SRTVoiceStudio_1.3.0.part*.bin SRTVoiceStudio_Setup_1.3.0.exe >nul
          if errorlevel 1 (
            echo [LOI] Khong the ghep file. Kiem tra da tai du tat ca cac part.
            pause
            exit /b 1
          )
          echo.
          echo Da ghep xong. Dang kiem tra SHA-256...
          certutil -hashfile "SRTVoiceStudio_Setup_1.3.0.exe" SHA256
          echo.
          echo SHA-256 dung phai la:
          echo F955633C700A48B87E8C96B4B2AD8A40D0FC522A0720A37EFF3D51DAE2A9A6CC
          echo.
          echo Neu ma trung khop, ban co the cai dat file EXE.
          pause
          "@
          Set-Content -Path 'release_assets/GHEP_SRTVoiceStudio_1.3.0.bat' -Value $bat -Encoding ASCII

          @"
          SRT Voice Studio 1.3.0 - Verified Windows Installer

          Validated source commit: f0c382929aec77b5a880438560d56a424aa6ce8a
          Validated workflow run: 34854705948
          Installer SHA-256: F955633C700A48B87E8C96B4B2AD8A40D0FC522A0720A37EFF3D51DAE2A9A6CC

          CACH 1: Tai truc tiep SRTVoiceStudio_Setup_1.3.0.exe.

          CACH 2: Neu file lon kho tai, tai TAT CA file SRTVoiceStudio_1.3.0.partXX.bin va GHEP_SRTVoiceStudio_1.3.0.bat vao cung mot thu muc. Chay file BAT de ghep lai EXE, sau do doi chieu SHA-256.

          So part: $partCount
          Moi part toi da: 25 MiB
          "@ | Set-Content -Path 'release_assets/HUONG_DAN_SRTVoiceStudio_1.3.0.txt' -Encoding UTF8

          Get-ChildItem release_assets -File | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToUpperInvariant()
            "$h *$($_.Name)"
          } | Set-Content 'release_assets/SHA256SUMS_ALL.txt' -Encoding ASCII

          Write-Host "Created $partCount split parts."
          Get-ChildItem release_assets | Format-Table Name,Length

      - name: Create or update GitHub Release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'srt-voice-studio-v1.3.0'
          $title = 'SRT Voice Studio 1.3.0 - Verified Windows Release'
          $notes = @"
          Verified Windows release built from commit f0c382929aec77b5a880438560d56a424aa6ce8a.

          GitHub Actions acceptance run 34854705948: SUCCESS.
          Installer SHA-256: F955633C700A48B87E8C96B4B2AD8A40D0FC522A0720A37EFF3D51DAE2A9A6CC

          Download the full EXE, or download all 25 MiB .bin parts plus GHEP_SRTVoiceStudio_1.3.0.bat and merge locally.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target f0c382929aec77b5a880438560d56a424aa6ce8a --title $title --notes $notes
          }
          gh release upload $tag release_assets/* --repo $env:GITHUB_REPOSITORY --clobber
