name: Build SRT Voice Studio 1.4 ZIP Update
on:
  workflow_dispatch:
  push:
    branches: ['srt-voice-studio/1.4.0']
    paths:
      - 'SRTVoiceStudio/**'
      - '.github/workflows/srt-voice-studio-1.4-zip-update.yml'
permissions:
  contents: read
  actions: read

env:
  BASE_INSTALLER_RUN: '34854705948'
  BASE_INSTALLER_SHA256: F955633C700A48B87E8C96B4B2AD8A40D0FC522A0720A37EFF3D51DAE2A9A6CC
  BASELINE_COMMIT: 1249412252f6e3e2e15ea57f1838cf6d86698f9e
  BASELINE_RUN: '34880069622'
  BASELINE_UPDATE_SHA256: D4A79C11FFC7B01F255540C1BFBB48E4BB9030A280B29D6C1D657C58DB579741
  FROM_VERSION: 1.3.1
  TO_VERSION: 1.4.0

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout 1.4 ZIP source
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Install locked Windows wheels
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r SRTVoiceStudio/requirements-build.lock

      - name: Prepare offline assets
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/prepare_offline_assets.py

      - name: Full unit and rule acceptance tests
        shell: pwsh
        run: |
          python -m pytest -q SRTVoiceStudio/tests --junitxml=SRTVoiceStudio/test-results.xml

      - name: Verify mandatory 1.4 voice rules
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/verify_voice_rules.py

      - name: Verify bundled FFmpeg filters
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/verify_ffmpeg_filters.py

      - name: Build current 1.4 frozen app
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/build_frozen.py

      - name: Test current 1.4 frozen app
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/test_frozen.py

      - name: Download exact verified 1.3.0 installer artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_INSTALLER_RUN }}
          name: SRTVoiceStudio_Setup_1.3.0
          path: SRTVoiceStudio/_baseline_installer

      - name: Download exact verified 1.3.1 ZIP update artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN }}
          name: SRTVoiceStudio_Update_1.3.0_to_1.3.1
          path: SRTVoiceStudio/_baseline_update

      - name: Stage exact released 1.3.1 primary baseline
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/stage_baseline.py

      - name: Build universal 1.3.1 to 1.4.0 delta ZIP
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/build_update.py

      - name: Verify two known 1.3.1 baseline variants are encoded
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/verify_baseline_variants.py

      - name: Test exact update, persistent rollback, reapply, idempotency and corruption guard
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/test_update.py

      - name: Test real registry update, rollback and reapply path
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/test_registry_update.py

      - name: Final ZIP checksum and acceptance summary
        shell: pwsh
        run: |
          python SRTVoiceStudio/scripts/finalize_update.py

      - name: Upload verified 1.4 ZIP update
        uses: actions/upload-artifact@v4
        with:
          name: SRTVoiceStudio_Update_1.3.1_to_1.4.0
          path: |
            SRTVoiceStudio/dist/SRTVoiceStudio_Update_1.3.1_to_1.4.0.zip
            SRTVoiceStudio/dist/SHA256SUMS.txt
            SRTVoiceStudio/dist/update_manifest.json
            SRTVoiceStudio/dist/update-build.json
            SRTVoiceStudio/dist/update-acceptance.json
            SRTVoiceStudio/dist/final-acceptance.json
            SRTVoiceStudio/dist/baseline-release.json
            SRTVoiceStudio/test-results.xml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-1.4-zip
          path: |
            SRTVoiceStudio/test-results.xml
            SRTVoiceStudio/dist/*.json
            SRTVoiceStudio/dist/*.txt
          if-no-files-found: ignore
