name: Build SRT Voice Studio 1.4 ZIP Update
on:
  workflow_dispatch:
  push:
    branches: ['srt-voice-studio/1.4.0-zip-final2']
    paths:
      - 'SRTVoiceStudio/**'
      - '.github/workflows/srt-voice-studio-1.4-zip-update.yml'
permissions:
  contents: read
  actions: read

env:
  BASELINE_COMMIT: f0c382929aec77b5a880438560d56a424aa6ce8a
  BASELINE_RUN: '34854705948'
  BASELINE_SHA256: F955633C700A48B87E8C96B4B2AD8A40D0FC522A0720A37EFF3D51DAE2A9A6CC
  FROM_VERSION: 1.3.0
  TO_VERSION: 1.4.0

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout 1.4 ZIP source
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Install locked Windows wheels
        working-directory: SRTVoiceStudio
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps unidic-lite==1.0.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze > installed-dependencies.txt

      - name: Prepare offline assets
        working-directory: SRTVoiceStudio
        run: python build_tools/prepare_assets.py

      - name: Full unit and rule acceptance tests
        working-directory: SRTVoiceStudio
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Verify mandatory 1.4 voice rules
        working-directory: SRTVoiceStudio
        shell: pwsh
        run: |
          @'
          import json
          from studio import __version__
          from studio.backend import EN_US_VOICES, EN_GB_VOICES, JA_VOICES
          from studio.aivis_pack import MODEL_PACKS, EXTRA_VOICES
          from studio.ui_text import voice_label

          assert __version__ == '1.4.0'
          assert len(EN_US_VOICES) == 20
          assert len(EN_GB_VOICES) == 8
          assert len(JA_VOICES) == 5
          assert len(MODEL_PACKS) == 6
          assert len(EXTRA_VOICES) == 4
          assert {v['name'].split(' — ',1)[0] for v in EXTRA_VOICES} == {'Rinne El','Aida Shigeru','Mai','Nise'}
          assert all(' · ' in voice_label(v) for v in JA_VOICES)
          assert 33 + 6 >= 39
          result = {
              'version':'1.4.0',
              'kokoro_us':len(EN_US_VOICES),
              'kokoro_uk':len(EN_GB_VOICES),
              'kokoro_ja':len(JA_VOICES),
              'aivis_ja_capacity':6,
              'speaker_capacity':39,
              'japanese_characteristic_labels':True,
              'dynamic_aivis_style_test':'covered by test_japanese_expansion.py'
          }
          open('update-rules.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          '@ | python -

      - name: Verify bundled FFmpeg filters
        working-directory: SRTVoiceStudio
        run: python build_tools/verify_filters.py

      - name: Build current 1.4 frozen app
        working-directory: SRTVoiceStudio
        run: python -m PyInstaller --clean --noconfirm SRTVoiceStudio.spec

      - name: Test current 1.4 frozen app
        working-directory: SRTVoiceStudio
        run: python build_tools/check_frozen.py

      - name: Download exact verified 1.3.0 installer artifact
        uses: actions/download-artifact@v4
        with:
          name: SRTVoiceStudio_Setup_1.3.0
          run-id: 34854705948
          github-token: ${{ github.token }}
          path: baseline-release

      - name: Verify 1.3.0 SHA and stage real installed baseline
        shell: pwsh
        run: |
          $installer = Get-ChildItem baseline-release -Recurse -File -Filter 'SRTVoiceStudio_Setup_1.3.0.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Verified 1.3.0 installer artifact is missing.' }
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $env:BASELINE_SHA256) { throw "1.3.0 SHA mismatch: $actual" }

          $target = Join-Path $env:GITHUB_WORKSPACE 'baseline-installed'
          Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS',"/DIR=$target")
          $p = Start-Process -FilePath $installer.FullName -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "1.3.0 installer exited with $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $target 'SRTVoiceStudio.exe'))) { throw 'Installed 1.3.0 executable is missing.' }
          if ((Get-ChildItem -LiteralPath $target -File -Filter 'unins*.exe').Count -lt 1) { throw 'Installed uninstaller is missing.' }

          New-Item -ItemType Directory -Force SRTVoiceStudio/update-output | Out-Null
          [ordered]@{
            baseline_run=$env:BASELINE_RUN
            baseline_commit=$env:BASELINE_COMMIT
            installer_sha256=$actual
            install_path=$target
            source='verified 1.3.0 GitHub Actions artifact'
          } | ConvertTo-Json | Set-Content SRTVoiceStudio/update-output/baseline-release.json -Encoding UTF8

      - name: Build 1.3.0 to 1.4.0 delta ZIP only
        working-directory: SRTVoiceStudio
        run: >-
          python build_tools/build_update_zip.py
          --baseline ../baseline-installed
          --current dist/SRTVoiceStudio
          --output-dir update-output
          --from-version ${{ env.FROM_VERSION }}
          --to-version ${{ env.TO_VERSION }}
          --baseline-commit ${{ env.BASELINE_COMMIT }}
          --baseline-run ${{ env.BASELINE_RUN }}

      - name: Test ZIP updater exact result, idempotency and corruption guard
        working-directory: SRTVoiceStudio
        run: >-
          python build_tools/test_update_zip.py
          --baseline ../baseline-installed
          --current dist/SRTVoiceStudio
          --package update-output/SRTVoiceStudio_Update_1.3.0_to_1.4.0.zip
          --result update-output/update-acceptance.json

      - name: Test real no-EXE registry update path
        shell: pwsh
        run: |
          $package = 'SRTVoiceStudio/update-output/SRTVoiceStudio_Update_1.3.0_to_1.4.0.zip'
          $expanded = Join-Path $env:GITHUB_WORKSPACE 'registry-update-package'
          Remove-Item -LiteralPath $expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $package -DestinationPath $expanded -Force
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $expanded 'Apply_Update.ps1') -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "ZIP updater exited with $LASTEXITCODE" }

          $reg = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{68F0C1C1-17CB-4CED-8261-5C18EB92571A}_is1'
          if (-not (Test-Path $reg)) { throw 'Installer registry record is missing.' }
          $info = Get-ItemProperty -Path $reg
          if ([string]$info.DisplayVersion -ne '1.4.0') { throw "DisplayVersion not updated: $($info.DisplayVersion)" }
          $target = [string]$info.InstallLocation
          if (-not (Test-Path -LiteralPath (Join-Path $target 'SRTVoiceStudio.exe'))) { throw 'Updated executable is missing.' }
          if ((Get-ChildItem -LiteralPath $target -File -Filter 'unins*.exe').Count -lt 1) { throw 'ZIP update removed installer-managed uninstaller.' }

      - name: Final ZIP checksum and acceptance summary
        working-directory: SRTVoiceStudio
        shell: pwsh
        run: |
          $file='update-output/SRTVoiceStudio_Update_1.3.0_to_1.4.0.zip'
          $digest=(Get-FileHash $file -Algorithm SHA256).Hash
          $size=(Get-Item $file).Length
          "$digest  SRTVoiceStudio_Update_1.3.0_to_1.4.0.zip" | Set-Content update-output/SHA256SUMS.txt
          [ordered]@{
            passed=$true
            package='SRTVoiceStudio_Update_1.3.0_to_1.4.0.zip'
            sha256=$digest
            bytes=$size
            baseline_sha256=$env:BASELINE_SHA256
            no_installer_exe_during_update=$true
            user_data_preserved=$true
            rollback_guard=$true
          } | ConvertTo-Json | Set-Content update-output/final-acceptance.json -Encoding UTF8
          Write-Host "UPDATE_ZIP_SHA256=$digest"
          Write-Host "UPDATE_ZIP_BYTES=$size"

      - name: Upload verified 1.4 ZIP update
        uses: actions/upload-artifact@v4
        with:
          name: SRTVoiceStudio_Update_1.3.0_to_1.4.0
          path: |
            SRTVoiceStudio/update-output/SRTVoiceStudio_Update_1.3.0_to_1.4.0.zip
            SRTVoiceStudio/update-output/SHA256SUMS.txt
            SRTVoiceStudio/update-output/update_manifest.json
            SRTVoiceStudio/update-output/update-build.json
            SRTVoiceStudio/update-output/update-acceptance.json
            SRTVoiceStudio/update-output/final-acceptance.json
            SRTVoiceStudio/update-output/baseline-release.json
            SRTVoiceStudio/update-rules.json
            SRTVoiceStudio/test-results.xml
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-1.4-zip
          path: |
            SRTVoiceStudio/test-results.xml
            SRTVoiceStudio/installed-dependencies.txt
            SRTVoiceStudio/build-assets/sha256.json
            SRTVoiceStudio/build/SRTVoiceStudio/warn-SRTVoiceStudio.txt
            SRTVoiceStudio/filter-validation.json
            SRTVoiceStudio/update-rules.json
            SRTVoiceStudio/update-output/
          if-no-files-found: warn
