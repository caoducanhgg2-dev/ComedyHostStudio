name: Test 5.5.5 Visual SRT

on:
  push:
    branches:
      - 5.5.5-visual-grounded
  pull_request:
    branches:
      - main

jobs:
  visual-srt-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile patches/5.5.5/visual_srt_555.py patches/5.5.5/test_visual_srt_555.py
      - name: Regression tests
        run: python patches/5.5.5/test_visual_srt_555.py
