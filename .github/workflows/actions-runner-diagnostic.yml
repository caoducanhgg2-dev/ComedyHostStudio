name: Actions Runner Diagnostic
on:
  push:
    branches: ['srt-voice-studio/1.3.1-zip-update']
    paths: ['.github/workflows/actions-runner-diagnostic.yml']
  workflow_dispatch:
jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner starts
        run: |
          echo "runner=$RUNNER_OS"
          uname -a
