name: Test 5.5.6 Visual Quality Stability

on:
  push:
    branches:
      - 5.5.6-visual-quality-stability
  pull_request:
    branches:
      - main

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile visual_srt_556.py runtime_stability_556.py engine_556.py patches/5.5.6/test_visual_srt_556.py patches/5.5.6/test_runtime_stability_556.py
      - name: Visual SRT regression
        run: python patches/5.5.6/test_visual_srt_556.py
      - name: Consecutive-run runtime regression
        run: python patches/5.5.6/test_runtime_stability_556.py
